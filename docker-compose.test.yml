services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: web_llm_test
      POSTGRES_PASSWORD: web_llm_test
      POSTGRES_DB: web_llm_test
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web_llm_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  tests:
    build: .
    environment:
      TEST_DATABASE_URL: postgresql+psycopg_async://web_llm_test:web_llm_test@db-test:5432/web_llm_test
    depends_on:
      db-test:
        condition: service_healthy
    command: pytest tests/integration -v
